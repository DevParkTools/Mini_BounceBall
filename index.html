</div>

</section>

let ac=null,sfxG=null,bgmG=null,bgmStep=0,bgmNext=0,bgmWorld=0;
function ensureAudio(){
 if(!ac){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{ac=new AC()}catch(e){ac=null;return}
  sfxG=ac.createGain();sfxG.connect(ac.destination);

function tone(f,d,type,v,f2,delay,dest){
 if(!ac)return;
 const t=ac.currentTime+(delay||0);
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=type;
 o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);
 g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(dest||sfxG);
 o.start(t);o.stop(t+d+0.02);
}

function degFreq(deg,base){
 const oct=Math.floor(deg/5);
 return base*Math.pow(2,(SCALE5[deg-oct*5]+12*oct)/12);
}
function bgmTick(){
 if(!ac||ac.state!=='running')return;
 const now=ac.currentTime;
 if(bgmNext<now)bgmNext=now+0.05;
 const base=BGM_BASE[bgmWorld],stepT=BGM_STEP[bgmWorld];
 while(bgmNext<now+0.3){
  const s=bgmStep%LEAD.length;
  const n=LEAD[s];
  if(n>=0)tone(degFreq(n,base*2),stepT*0.9,'triangle',0.09,0,bgmNext-now,bgmG);
  if(s%4===0)tone(degFreq(BASS[(s>>2)&7],base*0.5),stepT*2.5,'sine',0.14,0,bgmNext-now,bgmG);
  bgmNext+=stepT;
  bgmStep++;
 }
}

function rng32(seed){
 let a=seed>>>0;
 return function(){
  a=(a+0x6D2B79F5)>>>0;
  let t=a;
  t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);
  return((t^(t>>>14))>>>0)/4294967296;
 };
}

function gp(s,k){
 const wd=Math.floor(s/PER),ls=s%PER;
 if(wd===k)return ls<2?0:Math.min(1,0.55+ls*0.05);
 if(wd>k)return ls>=3?0.3:0;
 return 0;
}
const MODES=['X','U','D','Y','H'];
function modeOf(s){
 return s<2?'H':MODES[(s-2)%5];
}
function roomDims(land,s){
 const vc=land?20:15,vr=land?15:20;
 const mode=modeOf(s);
 const sc=Math.min(s,50);
 if(mode==='H'){
  if(s===0)return[vc,vr];
  return[land?Math.min(90,24+Math.round(s*1.3)):Math.min(64,18+Math.round(s*0.9)),vr];
 }
 if(mode==='U'||mode==='D')return[vc,vr+14+Math.round(sc*0.7)];
 const hh=vr+6+Math.round(sc*0.3);
 const n=Math.floor((hh-5)/1.8);
 return[Math.min(90,Math.max(vc,6+n*5)),hh];
}
function buildV(s,att,W,H,mode){
 const rnd=rng32(9000+s*7919+att*104729+W*131+H*17);
 const d=Math.min(1,s/14.5);
 const lv=Math.min(7,s/6);
 cols=W;rows=H;
 grid=new Uint8Array(cols*rows);
 for(let k=0;k<W;k++)grid[k]=SOLID;
 for(let r=0;r<H;r++){grid[r*W]=SOLID;grid[r*W+W-1]=SOLID}
 const up=mode==='U'||mode==='X',zig=mode==='U'||mode==='D';
 const mir=rnd()<0.5;
 const mx=(x,w)=>mir?W-x-w:x;
 const ps=[];
 let px0,pw,pr,dir=1;
 if(up){
  for(let r=H-2;r<H;r++)for(let k=1;k<W-1;k++)grid[r*W+k]=SOLID;
  px0=2;pw=3;pr=H-2;
 }else{
  ps.push({x:1,w:5,r:4,first:1});
  px0=1;pw=5;pr=4;
 }
 let guard=0;
 while(guard++<200){
  let dy=0,spr=0;
  const q=rnd();
  if(up){
   dy=q<0.2?1:2;
   if(s>=8&&pw>=4&&ps.length>0&&rnd()<0.15){dy=5;spr=1}
  }else dy=q<0.2?2:(q<0.7?3:4);
  let placed=false,nx0=0,nr=0,nw=3;
  const dys=spr?[dy]:(up?[dy,2,1]:[dy,3,2,4]);
  for(let di=0;di<dys.length&&!placed;di++){
   nr=up?pr-dys[di]:pr+dys[di];
   if(up?nr<5:nr>H-4)continue;
   for(let tr=0;tr<16&&!placed;tr++){
    nw=3+Math.floor(rnd()*(d>0.5?2:3));
    if(zig){if(tr>0)dir=-dir}else dir=1;
    const room=dir>0?W-1-(px0+pw)-nw:px0-1-nw;
    if(room<0)continue;
    const gap=Math.floor(rnd()*(Math.min(room,d>0.5?4:3)+1));
    nx0=dir>0?px0+pw+gap:px0-gap-nw;
    let bad=false;
    for(let k=0;k<ps.length;k++){
     const o=ps[k];
     if(o.x<nx0+nw&&nx0<o.x+o.w&&Math.abs(o.r-nr)<4){bad=true;break}
    }
    if(!bad)placed=true;
   }
  }
  if(!placed)break;
  if(spr&&ps.length>0)ps[ps.length-1].spring=dir>0?1:-1;
  ps.push({x:nx0,w:nw,r:nr});
  px0=nx0;pw=nw;pr=nr;
  if(!zig&&nx0+nw>=W-3)break;
 }
 const sx=[],sy=[],ws=[],wy=[],wr=[],wsp=[],wph=[],wl=[],okW=[];
 for(let i=0;i<ps.length;i++){
  const p=ps[i],w=p.w,r=p.r,x0=mx(p.x,w),first=!!p.first;
  const spring=p.spring?(mir?-p.spring:p.spring):0;
  const beat=!first&&!spring&&rnd()<0.4*gp(s,4);
  const g=rnd()<0.5?BEATA:BEATB;
  for(let k=0;k<w;k++){
   grid[r*W+x0+k]=beat?g:SOLID;
  }
  const cx=x0+w/2;
  let sawed=false,spiked=false;
  if(spring)grid[(r-1)*W+(spring>0?x0+w-2:x0+1)]=SPRT;
  if(!first&&!beat&&!spring&&w>=4){
   if(lv>=0.6&&rnd()<0.25+0.08*lv){
    ws.push(cx);wy.push(r-0.5);wr.push(Math.min(0.8+0.2*lv,w/2-0.7));wsp.push(2+0.4*lv);wph.push(rnd()*TAU);
    sawed=true;
   }else if(rnd()<0.25+d*0.5){
    const idx=1+Math.floor(rnd()*(w-2));
    grid[(r-1)*W+x0+idx]=rnd()<0.8*gp(s,0)?BSPIKE:SPIKE;
    spiked=true;
   }
  }
  okW.push(!first&&!beat&&!spring&&w>=3);
  if(!first&&!beat&&!spring&&w>=4&&rnd()<0.7*gp(s,2))wl.push(x0+0.5,r-7,x0+w-0.5,r,(rnd()<0.5?-1:1)*(22+4*Math.min(lv,3)));
  if(!first){
   sx.push(cx);sy.push(r-1.6);
   if(s>=2&&w>=4&&!sawed&&rnd()<0.4){sx.push(cx);sy.push(r-2.4)}
  }

function buildRoom(s,att,W,H){

   const pwid=2+Math.floor(rnd()*(1+Math.floor(d*4+Math.min(1,Math.max(0,s-30)/40))));
   if(remain>=pwid+3){

   const n=2+Math.floor(rnd()*2);

    rx.push(c);rw.push(pill);rh.push(h);rt.push(0);c+=pill;
   }
   continue;

  let w=first?4:(rnd()<0.2?2:3+Math.floor(rnd()*(inner>14?(d>0.4?6:4):3)));
  if(remain-w<3)w=remain;

 if(rnd()<Math.min(0.95,gp(s,3))){

   for(let cx=x0;cx<=x1;cx++){

    const dx=bx-qx,dy=by-qy;

   ctx.fillRect(x-sz*0.5,y-sz*2,sz,sz*4);
   ctx.fillRect(x-sz*2,y-sz*0.5,sz*4,sz);
  }else{
   const k=(t*(0.03+c*0.04)+b)%1;

 ctx.globalAlpha=1;

function camTx(){

 if(m<=0)return 0;

 return t<0?0:(t>m?m:t);
}
function camTy(){
 const m=rows-vrows;
 if(m<=0)return 0;
 const la=vy>0?Math.min(vrows*0.34,vy*0.3):vy*0.1;
 const t=by+la+vrows*0.06-vrows*0.5;
 return t<0?0:(t>m?m:t);
}
function updateCam(dt){

 if(mx<=0&&my<=0){camX=0;camY=0;return}
 if(state===INTRO){
  const k=Math.min(1,introT/INTRO_DUR),e=1-(1-k)*(1-k)*(1-k);
  const tx=camTx(),ty=camTy();
  const x0=tx<mx*0.5?mx:0,y0=ty<my*0.5?my:0;
  camX=x0+(tx-x0)*e;

 }
 if(state===PAUSE)return;

}

 }

 if(rs<SKIN_NEED[v]){toast('별점 '+SKIN_NEED[v]+'개가 필요해요 (현재 '+rs+')');return}
 save.skin=v;
 writeSave();
 syncSeg('segSkin','skin');
}));
bindSeg('segRot','rot',layout);
bindSeg('segRes','res',layout);
bindSeg('segFps','fps',()=>{});

function layout(){
 const vw=window.innerWidth,vh=window.innerHeight;
 const devLand=vw>=vh;
 rotated=(save.rot===1&&!devLand)||(save.rot===2&&devLand);
 cssW=rotated?vh:vw;cssH=rotated?vw:vh;
 stageEl.style.width=cssW+'px';
 stageEl.style.height=cssH+'px';
 stageEl.style.transform=rotated?'translate('+vw+'px,0) rotate(90deg)':'none';
 stageEl.style.setProperty('--u',(Math.min(cssW,cssH)/100)+'px');
 const land=cssW>=cssH;
 stageEl.classList.toggle('land',land);
 stageEl.classList.toggle('port',!land);
 dpr=calcDpr();
 cw=Math.floor(cssW*dpr);ch=Math.floor(cssH*dpr);
 if(cv.width!==cw)cv.width=cw;
 if(cv.height!==ch)cv.height=ch;
 const m=Math.min(cw,ch);
 vigGrad=ctx.createRadialGradient(cw*0.5,ch*0.5,m*0.35,cw*0.5,ch*0.5,Math.hypot(cw,ch)*0.55);
 vigGrad.addColorStop(0,'rgba(0,0,0,0)');
 vigGrad.addColorStop(1,'rgba(0,0,0,0.42)');
 menuDirty=true;
 if(state===MENU)menuDims();
 else fitRoom();
}
let layoutQueued=false;
function queueLayout(){
 if(layoutQueued)return;
 layoutQueued=true;
 requestAnimationFrame(()=>{layoutQueued=false;layout()});
}
window.addEventListener('resize',queueLayout);
window.addEventListener('orientationchange',()=>setTimeout(queueLayout,150));
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){
  if(state===PLAY||state===DEAD||state===INTRO)pauseGame();
  if(ac)ac.suspend();
 }else{
  if(ac)ac.resume();
  if(stageEl.classList.contains('game'))wake(true);
 }
});
window.addEventListener('blur',()=>{if(state===PLAY||state===DEAD||state===INTRO)pauseGame()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('pointerdown',ensureAudio,{passive:true});

function buildLogo(){
 const el=$('logo');
 const txt='HOP STAR';
 for(let i=0;i<txt.length;i++){
  const s=document.createElement('span');
  s.style.setProperty('--i',i);
  if(txt[i]===' ')s.className='gap';
  else{
   s.textContent=txt[i];
   if(i>3)s.className='y';
  }
  el.appendChild(s);
 }
}

glowGold=makeGlow(255,210,60);
glowWhite=makeGlow(255,255,255);
glowPurple=makeGlow(190,120,255);
for(let i=0;i<SKIN_COL.length;i++){
 const k=SKIN_COL[i];
 gradSkins.push(makeBallGrad(k[0],k[1],k[2]));
 glowSkins.push(makeGlow(k[3],k[4],k[5]));
}
gradYellow=makeBallGrad('#fff7a8','#ffd22e','#e69a00');

loadSave();
buildLogo();
buildSelectUi();
refreshSelect(false);
refreshSettings();
layout();
saveInfo.textContent=saveText();
show('title');
requestAnimationFrame(frame);
})();
